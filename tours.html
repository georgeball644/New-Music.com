<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="https://googleapis.com" />
    <style>
      .playlist-cover-image { object-fit: cover; border-radius: 8px; }
      #musicTabBtn, #merchTabBtn, #sidebarHome, #sidebarLogo { cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="tour">
      <section class="sidebar">
        <h3 class="title" id="sidebarLogo">New-Music.com</h3>
        <div class="list">
          <button class="menu-item2" id="sidebarHome"><div class="home">Home</div></button>
        </div>
      </section>
      <main class="main-content">
        <section class="main-content2">
          <div class="header-row">
            <div class="title3">
              <h1 class="playlist-section-title">Upcoming Live Tour Dates</h1>
              <div class="releases-24th-of">Book Tickets & Concert Venues</div>
            </div>
            <div class="navigation">
              <div class="segmented-control">
                <nav class="segmented-control2">
                  <div class="item-1" id="musicTabBtn"><div class="music">Music</div></div>
                  <div class="item-3" id="merchTabBtn"><div class="music">Merch</div></div>
                  <div class="item-6" style="background-color: var(--color-white);"><div class="tours">Tours</div></div>
                </nav>
              </div>
            </div>
          </div>
          <section class="large-grid">
            <div class="card">
              <img class="playlist-cover-image" src="https://wikimedia.org_–_Kiss_All_the_Time._Disco%2C_Occasionally_%28album_cover%29.png" />
              <div class="copy"><h3 class="ariana-grande">London O2 Arena - July 24</h3></div>
            </div>
            <div class="card">
              <img class="playlist-cover-image" src="https://wikimedia.org" />
              <div class="copy"><h3 class="ariana-grande">Manchester AO Arena - August 12</h3></div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script>
      document.getElementById("musicTabBtn").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("sidebarHome").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("sidebarLogo").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("merchTabBtn").addEventListener("click", function() { window.location.href = "./merch.html"; });
    </script>
  </body>
</html>
