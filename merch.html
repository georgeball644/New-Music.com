<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <link rel="stylesheet" href="https://googleapis.com" />
    <style>
      /* Embedded color blocks and structural boundaries */
      body { margin: 0; background-color: #000000 !important; color: #ffffff !important; font-family: 'Inter', sans-serif; }
      .merch { display: flex; min-height: 100vh; background-color: #000000; }
      
      /* Navigation column and custom button arrays */
      .sidebar { width: 240px; background-color: #121212; padding: 24px; position: fixed; height: 100vh; box-sizing: border-box; border-right: 1px solid #282828; }
      .title { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #fff; }
      .menu-item2 { background: #282828; border: none; color: #fff; padding: 10px 16px; border-radius: 8px; text-align: left; width: 100%; cursor: pointer; }
      
      /* Main grid frame viewport spacing */
      .main-content { margin-left: 240px; padding: 40px; width: calc(100% - 240px); box-sizing: border-box; }
      .top-header-row { display: flex; align-items: center; margin-bottom: 32px; }
      .large-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; width: 100%; }
      
      /* Product layout slots and active image tags */
      .card { background-color: #181818; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .playlist-cover-image { width: 100% !important; height: auto !important; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; display: block !important; }
      h3 { margin: 0; font-size: 16px; color: #fff; }
      
      /* Menu list selector configurations */
      .segmented-control { margin-left: auto; }
      .segmented-control2 { display: flex; background-color: #181818; padding: 4px; border-radius: 8px; gap: 4px; }
      .item-1, .item-3, .item-6 { padding: 6px 16px; border-radius: 6px; color: #b3b3b3; cursor: pointer; font-size: 14px; }
      .item-3 { background-color: #ffffff; color: #000000; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="merch">
      <section class="sidebar">
        <h3 class="title" id="sidebarLogo" style="cursor: pointer;">New-Music.com</h3>
        <div class="list">
          <button class="menu-item2" id="sidebarHome">Home</button>
        </div>
      </section>
      <main class="main-content">
        <div class="top-header-row">
          <div>
            <h1 style="margin:0; font-size: 28px;">Official Merchandise Store</h1>
            <div style="color:#b3b3b3; margin-top:4px; font-size: 14px;">Shop Limited Vinyls & Music Products</div>
          </div>
          <div class="segmented-control">
            <div class="segmented-control2">
              <div class="item-1" id="item1Container">Music</div>
              <div class="item-3">Merch</div>
              <div class="item-6" id="item6Container">Tours</div>
            </div>
          </div>
        </div>
        <section class="large-grid">
          <div class="card">
            <img class="playlist-cover-image" src="https://wikimedia.org" />
            <div class="copy"><h3>Brat Special Vinyl - £32.99</h3></div>
          </div>
          <div class="card">
            <img class="playlist-cover-image" src="https://wikimedia.org" />
            <div class="copy"><h3>Petal Limited Hoodie - £45.00</h3></div>
          </div>
          <div class="card">
            <img class="playlist-cover-image" src="https://wikimedia.org" />
            <div class="copy"><h3>Short n' Sweet Vinyl - £29.99</h3></div>
          </div>
        </section>
      </main>
    </div>
    <script>
      document.getElementById("item1Container").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("sidebarHome").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("sidebarLogo").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("item6Container").addEventListener("click", function() { window.location.href = "./tours.html"; });
    </script>
  </body>
</html>
