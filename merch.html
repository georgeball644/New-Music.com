<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="https://googleapis.com" />
    <style>
      .playlist-cover-image, .image-icon4, .image-icon7 { object-fit: cover; border-radius: 8px; }
      #item1Container, #item6Container, #sidebarHome, #sidebarLogo { cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="merch">
      <section class="sidebar">
        <h3 class="title" id="sidebarLogo">New-Music.com</h3>
        <div class="list">
          <button class="menu-item2" id="sidebarHome"><div class="home">Home</div></button>
        </div>
      </section>
      <main class="main-content">
        <div class="top-header-row">
          <div class="title3">
            <h1 class="playlist-section-title">Official Merchandise Store</h1>
            <div class="releases-24th-of">Shop Limited Vinyls & Music Products</div>
          </div>
          <div class="segmented-control">
            <div class="segmented-control2">
              <div class="item-1" id="item1Container"><div class="music">Music</div></div>
              <div class="item-3" style="background-color: var(--color-white);"><div class="music">Merch</div></div>
              <div class="item-6" id="item6Container"><div class="music">Tours</div></div>
            </div>
          </div>
        </div>
        <section class="large-grid">
          <div class="card">
            <img class="playlist-cover-image" src="https://wikimedia.org" />
            <div class="copy"><h3 class="ariana-grande">Brat Special Vinyl - £32.99</h3></div>
          </div>
          <div class="card">
            <img class="playlist-cover-image" src="https://wikimedia.org" />
            <div class="copy"><h3 class="ariana-grande">Petal Limited Hoodie - £45.00</h3></div>
          </div>
          <div class="card">
            <img class="playlist-cover-image" src="https://wikimedia.org" />
            <div class="copy"><h3 class="ariana-grande">Short n' Sweet Vinyl - £29.99</h3></div>
          </div>
        </section>
      </main>
    </div>
    <script>
      document.getElementById("item1Container").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("sidebarHome").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("sidebarLogo").addEventListener("click", function() { window.location.href = "./index.html"; });
      document.getElementById("item6Container").addEventListener("click", function() { window.location.href = "./tours.html"; });
    </script>
  </body>
</html>
